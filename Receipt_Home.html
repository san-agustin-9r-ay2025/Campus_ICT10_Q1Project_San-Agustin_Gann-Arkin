<body class="bg-dark">                                                                                                              <!-- make the background black -->

                <div class="container-fluid">                                                                                       <!-- make a container to 100% in any device -->
                    <div class="col-6 text-center text-dark">                                                                       <!-- make a div with he width of 6 in the grid, and making the texts centered and black -->
                        <h3>Rking's Drum Store</h3>                                                                                 <!-- add text -->
                    </div>
                    <div class="col-3">                                                                                             <!-- make a div with the width of 3 in the grid -->
                        <ul class="navbar-nav">                                                                                     <!-- make parent element of list -->

                        </ul>
                    </div>

                        <input class="col-6" type="checkbox" id="cymbals1" value =13000>                                            <!-- make checkbox -->
